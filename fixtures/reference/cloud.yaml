providers:
  aws:
    name: aws
    asn: 16509
  gcp:
    name: gcp
    asn: 15169
  azure:
    name: azure
    asn: 8075

regions:
  - provider: aws
    name: us-east-1
  - provider: gcp
    name: us-central1
  - provider: azure
    name: eastus

transit_gateways:
  - name: aws-tgw-1
    provider: aws

vpcs:
  - name: vpc-aws-use1
    provider: aws
    region: us-east-1
    cidr: 10.240.0.0/16
    transit_gateway: aws-tgw-1
  - name: vpc-gcp-usc
    provider: gcp
    region: us-central1
    cidr: 10.241.0.0/16

route_tables:
  - name: rt-aws-tgw-1
    transit_gateway: aws-tgw-1
    entries:
      - { prefix: 10.240.0.0/16, target: tgw-attach-vpc-aws-use1 }
      - { prefix: 10.50.0.0/22, target: tgw-attach-dx1 }
      - { prefix: 10.50.4.0/22, target: tgw-attach-dx2 }
  - name: rt-vpc-gcp-usc
    vpc: vpc-gcp-usc
    entries:
      - { prefix: 10.241.0.0/16, target: gateway }
      - { prefix: 10.50.0.0/22, target: gcp-edge-dc1 }
      - { prefix: 10.50.4.0/22, target: gcp-edge-dc2 }

interconnects:
  - name: dx1-aws-use1
    kind: direct_connect
    provider: aws
    region: us-east-1
    device: dc1-edge-1
    interface: et-0/2/0
    vif: dxvif-100
    vlan: 100
    capacity_gbps: 10
  - name: dx2-aws-use1
    kind: direct_connect
    provider: aws
    region: us-east-1
    device: dc2-edge-3
    interface: et-0/2/0
    vif: dxvif-101
    vlan: 100
    capacity_gbps: 10
  - name: cic1-gcp-usc
    kind: cloud_interconnect
    provider: gcp
    region: us-central1
    device: dc1-edge-2
    interface: et-0/2/0
    vif: bc-111
    vlan: 111
    capacity_gbps: 10
  - name: er1-azure-eastus
    kind: expressroute
    provider: azure
    region: eastus
    device: dc2-edge-4
    interface: et-0/2/0
    vif: msee-122
    vlan: 200
    capacity_gbps: 2

sessions:
  - name: s-dc1e1-aws
    type: ebgp
    local_device: dc1-edge-1
    local_asn: 65100
    peer_asn: 16509
    peer: aws-use1-dx1
    local_ip: 10.110.0.1
    peer_ip: 10.110.0.2
    interconnect: dx1-aws-use1
    policy_in: CLOUD_INC_LP
    policy_out: EBGP_OUT
  - name: s-dc2e3-aws
    type: ebgp
    local_device: dc2-edge-3
    local_asn: 65100
    peer_asn: 16509
    peer: aws-use1-dx2
    local_ip: 10.112.0.1
    peer_ip: 10.112.0.2
    interconnect: dx2-aws-use1
    policy_in: CLOUD_INC_LP
    policy_out: EBGP_OUT
  - name: s-dc1e2-gcp
    type: ebgp
    local_device: dc1-edge-2
    local_asn: 65100
    peer_asn: 15169
    peer: gcp-usc1-cic1
    local_ip: 10.111.0.1
    peer_ip: 10.111.0.2
    interconnect: cic1-gcp-usc
    policy_in: CLOUD_INC_LP
    policy_out: EBGP_OUT
  - name: s-dc2e4-azure
    type: ebgp
    local_device: dc2-edge-4
    local_asn: 65100
    peer_asn: 8075
    peer: azure-eastus-er1
    local_ip: 10.113.0.1
    peer_ip: 10.113.0.2
    interconnect: er1-azure-eastus
    policy_in: CLOUD_INC_LP
    policy_out: EBGP_OUT