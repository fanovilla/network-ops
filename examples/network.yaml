prefixes:
- prefix: 10.50.0.0/22
  origin_device: dc-edge-1
  anycast: true
  labels:
  - service
- prefix: 10.50.0.0/22
  origin_device: dc-edge-2
  anycast: true
  labels:
  - service
- prefix: 10.100.0.0/20
  origin_device: dc-core-1
  local_pref: 120
  labels:
  - backend
- prefix: 10.200.0.0/24
  anycast: true
  local_pref: 130
  labels:
  - dns
interconnects:
- name: dx1-aws-use1
  kind: direct_connect
  provider: aws
  region: us-east-1
  device: dc-edge-1
  interface: et-edge-dx
  vif: dxvif-100
  vlan: 100
  capacity_gbps: 10
  ipv4: 10.110.0.0/30
  status: up
- name: cic1-gcp-usc
  kind: cloud_interconnect
  provider: gcp
  region: us-central1
  device: dc-edge-2
  interface: et-edge-dx
  vif: bc-111
  vlan: 111
  capacity_gbps: 10
  ipv4: 10.111.0.0/30
- name: er1-azure-eastus
  kind: expressroute
  provider: azure
  region: eastus
  device: dc-edge-1
  interface: et-edge-er
  vif: msee-122
  vlan: 200
  capacity_gbps: 2
  ipv4: 10.112.0.0/30
transit_gateways:
- name: aws-tgw-1
  provider: aws
vpcs:
- name: vpc-aws-use1
  provider: aws
  region: us-east-1
  cidr: 10.240.0.0/16
  transit_gateway: aws-tgw-1
- name: vpc-gcp-usc
  provider: gcp
  region: us-central1
  cidr: 10.241.0.0/16
route_tables:
- name: rt-aws-tgw-1
  transit_gateway: aws-tgw-1
  entries:
  - prefix: 10.240.0.0/16
    target: tgw-attach-vpc-aws-use1
    kind: propagated
  - prefix: 10.50.0.0/22
    target: tgw-attach-dc1
    kind: propagated
- name: rt-vpc-gcp-usc
  vpc: vpc-gcp-usc
  entries:
  - prefix: 10.241.0.0/16
    target: gateway
    kind: propagated
  - prefix: 10.50.0.0/22
    target: gcp-edge-dc1
    kind: static
rr_clusters:
- id: dc1
  reflectors:
  - dc-core-1
  - dc-core-2
  clients:
  - dc-edge-1
  - dc-edge-2
  - dc-agg-1
sessions:
- name: s-c1-c2
  type: ibgp
  local_device: dc-core-1
  local_asn: 65100
  peer_asn: 65100
  peer: dc-core-2
  local_ip: 10.10.0.1
  peer_ip: 10.10.0.2
  multihop: true
- name: s-e1-c1
  type: ibgp
  local_device: dc-edge-1
  local_asn: 65100
  peer_asn: 65100
  peer: dc-core-1
  local_ip: 10.10.2.1
  peer_ip: 10.10.0.1
  multihop: true
  rr_client: true
- name: s-e1-c2
  type: ibgp
  local_device: dc-edge-1
  local_asn: 65100
  peer_asn: 65100
  peer: dc-core-2
  local_ip: 10.10.2.1
  peer_ip: 10.10.0.2
  multihop: true
  rr_client: true
- name: s-e2-c1
  type: ibgp
  local_device: dc-edge-2
  local_asn: 65100
  peer_asn: 65100
  peer: dc-core-1
  local_ip: 10.10.2.2
  peer_ip: 10.10.0.1
  multihop: true
  rr_client: true
- name: s-e2-c2
  type: ibgp
  local_device: dc-edge-2
  local_asn: 65100
  peer_asn: 65100
  peer: dc-core-2
  local_ip: 10.10.2.2
  peer_ip: 10.10.0.2
  multihop: true
  rr_client: true
  admin_down: true
- name: s-agg-c1
  type: ibgp
  local_device: dc-agg-1
  local_asn: 65100
  peer_asn: 65100
  peer: dc-core-1
  local_ip: 10.10.1.1
  peer_ip: 10.10.0.1
  multihop: true
  rr_client: true
- name: s-agg-c2
  type: ibgp
  local_device: dc-agg-1
  local_asn: 65100
  peer_asn: 65100
  peer: dc-core-2
  local_ip: 10.10.1.1
  peer_ip: 10.10.0.2
  multihop: true
  rr_client: true
- name: s-e1-aws
  type: ebgp
  local_device: dc-edge-1
  local_asn: 65100
  peer_asn: 16509
  peer: aws-use1
  local_ip: 10.110.0.1
  peer_ip: 10.110.0.2
  allowas_in: true
  interconnect: dx1-aws-use1
  policy_in: CLOUD_INC_LP
  policy_out: EBGP_ALLOW
- name: s-e2-aws
  type: ebgp
  local_device: dc-edge-2
  local_asn: 65100
  peer_asn: 16509
  peer: gcp-usc1
  local_ip: 10.111.0.1
  peer_ip: 10.111.0.2
  interconnect: cic1-gcp-usc
  policy_in: CLOUD_INC_LP
  policy_out: EBGP_ALLOW
prefix_lists:
- name: PL_DC_SVC
  entries:
  - prefix: 10.50.0.0/22
  - prefix: 10.100.0.0/20
    le: 20
as_path_filters:
- name: AS_PATH_NONE
  regex: ^$
- name: AS_PATH_KNOWN
  regex: ^(65500|16509|15169|8075)+$
community_lists:
- name: COMMUNITY_NO_EXPORT
  communities:
  - 65100:no-export
route_policies:
- name: CLOUD_INC_LP
  statements:
  - order: 10
    action: permit
    match:
      prefix_list: PL_DC_SVC
    set:
      local_pref: 120
      weight: 100
  - order: 20
    action: permit
    match:
      community_list: COMMUNITY_NO_EXPORT
    set:
      med: 50
  - order: 30
    action: permit
- name: EBGP_ALLOW
  statements:
  - order: 10
    action: permit
- name: LB_PREPEND
  statements:
  - order: 10
    action: permit
    set:
      as_path_prepend: 2
      communities:
      - 65100:no-export
