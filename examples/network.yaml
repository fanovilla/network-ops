links:
- name: l-c1-c2
  device_a: dc-core-1
  interface_a: et-core-edge1
  device_b: dc-core-2
  interface_b: et-core-edge1
  type: lag
  metric: 5
  bandwidth_gbps: 200
  fate_share_group: lag-core12
